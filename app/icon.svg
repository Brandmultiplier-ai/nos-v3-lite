<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- NOS favicon — total eclipse (diamond ring): dark core + bright corona ring + highlight, on a dark tile -->
  <defs>
    <linearGradient id="g" x1="20" y1="16" x2="82" y2="86" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A855F7"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <radialGradient id="core" cx="42%" cy="38%" r="70%">
      <stop offset="0" stop-color="#1d1b34"/>
      <stop offset="1" stop-color="#0a0910"/>
    </radialGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="#0e0e13"/>
  <circle cx="50" cy="50" r="22" fill="url(#core)"/>
  <circle cx="50" cy="50" r="26.5" fill="none" stroke="url(#g)" stroke-width="5"/>
  <circle cx="69" cy="31" r="4" fill="#fff"/>
</svg>
